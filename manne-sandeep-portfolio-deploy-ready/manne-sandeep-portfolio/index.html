<style data-purpose="typography-theme">
    body {

      color: #e2e8f0;

      overflow-x: hidden;
      user-select: none;
      min-height: 100vh;

        linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 100% 100%, 64px 64px, 64px 64px;
    }

    /* 3D sculpted / debossed typography style */
    .sculpted-text {
      color: #171720;
      font-weight: 800;
      letter-spacing: -0.05em;
      text-shadow: 
        -1px -1px 1px rgba(255, 255, 255, 0.12),
        1px 1px 2px rgba(0, 0, 0, 0.95),
        0 0 25px rgba(24, 24, 34, 0.9);
      background: linear-gradient(180deg, #2b2c3a 0%, #171822 55%, #0f1017 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.9));
    }

    /* Fluid size: 270px on wide screens (as designed), scales down so the word never clips on tablets/phones */
    .portfolio-word {
      font-size: clamp(56px, 21vw, 270px);
    }

    /* Outer stroke highlight effect */
    .sculpted-outline {
      stroke: rgba(255, 255, 255, 0.08);
      stroke-width: 1.5;
      fill: none;
    }
  </style>
<!-- Drawing Laser Path & Pen Floating Styles -->
<style data-purpose="pen-motion-styles">
    /* Animated luminous drawing stroke */
    .drawing-path-glow {
      stroke-dasharray: 2600;
      stroke-dashoffset: 2600;
      filter: drop-shadow(0 0 10px #c084fc) drop-shadow(0 0 24px rgba(56, 189, 248, 0.8));
      transition: stroke-dashoffset 0.1s linear;
    }

    /* Pen wrapper smoothing */
    #pen-container {
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
      pointer-events: none;
      transform: translate3d(0, 0, 0);
      will-change: transform;
      z-index: 40;
      transition: opacity 0.3s ease;
    }

    /* Pen tilt — pivots on the nib tip so the tip always sits exactly on the stroke */
    .pen-body {
      transform-origin: 24px 147px;
      transform: rotate(-35deg);
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.85));
    }

    /* Glowing nib tip emission */
    .nib-glow-emitter {
      animation: pulse-glow 1.8s infinite alternate ease-in-out;
    }

    @keyframes pulse-glow {
      0% {
        filter: drop-shadow(0 0 6px #a855f7) drop-shadow(0 0 14px #38bdf8);
        opacity: 0.9;
      }
      100% {
        filter: drop-shadow(0 0 16px #e879f9) drop-shadow(0 0 28px #60a5fa);
        opacity: 1;
      }
    }

    /* Subtle pulse animation for status beacon */
    @keyframes status-pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
      }
      50% {
        opacity: 0.6;
        transform: scale(0.92);
        box-shadow: 0 0 12px 2px rgba(16, 185, 129, 0.3);
      }
    }

    .status-dot {
      animation: status-pulse 2s infinite ease-in-out;
    }

<!-- BEGIN: AnimationControlScript -->
<script data-purpose="pen-motion-controller">
    document.addEventListener('DOMContentLoaded', () => {
      const path = document.getElementById('active-trace-path');
      const pen = document.getElementById('pen-container');
      const spark = document.getElementById('nib-spark');
      const svg = document.getElementById('trace-svg');
      const replayBtn = document.getElementById('btn-replay');
      const statusLabel = document.getElementById('pen-status-label');

      if (!path || !pen || !svg) return;

      const pathLength = path.getTotalLength();
      path.style.strokeDasharray = `${pathLength} ${pathLength}`;
      path.style.strokeDashoffset = `${pathLength}`;

      let animationFrameId = null;
      let restartTimer = null;
      let startTime = null;
      const duration = 6500; // 6.5 seconds trace duration

      // Nib tip position inside the stylus SVG (the pen pivots on this point)
      const penTipOffsetX = 24;
      const penTipOffsetY = 147;

      function updatePenCoordinates(progress) {
        // Point along the SVG vector path
        const currentLength = progress * pathLength;
        const pt = path.getPointAtLength(currentLength);

        // Reveal the drawn stroke up to this point
        path.style.strokeDashoffset = `${pathLength - currentLength}`;

        // Move the nib spark (SVG coordinates)
        if (spark) {
          spark.setAttribute('cx', pt.x);
          spark.setAttribute('cy', pt.y);
        }

        // Convert the SVG point to viewport pixels using the real SVG transform
        // (handles viewBox scaling and letterboxing at every screen size)
        const ctm = path.getScreenCTM();
        if (!ctm) return;
        const svgPoint = svg.createSVGPoint();
        svgPoint.x = pt.x;
        svgPoint.y = pt.y;
        const screenPt = svgPoint.matrixTransform(ctm);

        // The pen is absolutely positioned inside its offset parent,
        // so convert the viewport point into that parent's local coordinates
        const parent = pen.offsetParent || document.body;
        const parentRect = parent.getBoundingClientRect();
        const localX = screenPt.x - parentRect.left;
        const localY = screenPt.y - parentRect.top;

        // Place the pen so its nib tip sits directly on the stroke
        pen.style.transform = `translate3d(${localX - penTipOffsetX}px, ${localY - penTipOffsetY}px, 0)`;
      }

      function animateLoop(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        let progress = elapsed / duration;

        if (progress > 1) {
          updatePenCoordinates(1);
          if (statusLabel) statusLabel.textContent = 'Completed';

          // Hold briefly, then replay
          restartTimer = setTimeout(restartAnimation, 1800);
          return;
        }

        // Smooth cubic ease-in-out progress
        const easeProgress = progress < 0.5
          ? 2 * progress * progress
          : -1 + (4 - 2 * progress) * progress;

        updatePenCoordinates(easeProgress);
        animationFrameId = requestAnimationFrame(animateLoop);
      }

      function startAnimation() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (restartTimer) clearTimeout(restartTimer);
        startTime = null;
        if (statusLabel) statusLabel.textContent = 'Active Tracing';
        pen.style.opacity = '1';
        animationFrameId = requestAnimationFrame(animateLoop);
      }

      function restartAnimation() {
        if (animationFrameId) cancelAnimationFrame(animationFrameId);
        if (restartTimer) clearTimeout(restartTimer);
        path.style.strokeDashoffset = `${pathLength}`;
        startTime = null;
        startAnimation();
      }

      // Replay button listener
      replayBtn?.addEventListener('click', (e) => {
        e.preventDefault();
        restartAnimation();
      });

      // Keep the pen aligned with the stroke when the window is resized
      window.addEventListener('resize', () => {
        const progress = 1 - (parseFloat(path.style.strokeDashoffset) / pathLength);
        updatePenCoordinates(Math.max(0, Math.min(1, progress || 0)));
      });

      // Initiate on startup
      startAnimation();
    });
  </script>
<!-- END: AnimationControlScript -->
